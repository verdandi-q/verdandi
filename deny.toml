[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0437", reason = "protobuf 2 via raft 0.7; parses only frames from peers authenticated by the cluster key; see plans/hardening.md" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash via raft 0.7; unmaintained, no known flaw; see plans/hardening.md" },
]
