[package]
name = "verdandi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
verdandi-control = { path = "../verdandi-control" }
verdandi-core = { path = "../verdandi-core" }
verdandi-http = { path = "../verdandi-http" }
verdandi-net = { path = "../verdandi-net" }
verdandi-node = { path = "../verdandi-node" }
verdandi-store = { path = "../verdandi-store" }
anyhow = "1.0.104"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
protobuf = "2"
raft = { version = "0.7", default-features = false, features = ["protobuf-codec"] }
mimalloc = "0.1"
object_store = { version = "0.14", default-features = false, features = ["aws", "fs"] }
sha2 = { version = "0.10", default-features = false }
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[features]
next-format = []
slow-repair = ["verdandi-core/slow-repair"]

[[test]]
name = "cluster"
path = "../../tests/cluster/main.rs"

[[test]]
name = "invariants"
path = "../../tests/invariants/main.rs"

[[test]]
name = "scenarios"
path = "../../tests/scenarios/main.rs"

[dev-dependencies]
crc32c = "0.6.8"
reqwest = { version = "0.13.5", default-features = false }
serde_json = "1"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt"] }
verdandi-sim = { path = "../verdandi-sim" }
