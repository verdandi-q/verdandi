[package]
name = "verdandi-http"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
verdandi-core = { path = "../verdandi-core" }
verdandi-store = { path = "../verdandi-store" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "query", "tokio"] }
base64 = "0.22.1"
futures-util = { version = "0.3.34", default-features = false }
http-body-util = "0.1.5"
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1.53.2", features = ["macros", "net", "rt", "sync", "time"] }
tracing = "0.1.44"
tower-http = { version = "0.6.11", features = ["cors"] }
utoipa = "5"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["io-util", "macros", "rt", "test-util"] }
tower-service = "0.3.3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
verdandi-sim = { path = "../verdandi-sim" }
