apiVersion: v1
kind: Service
metadata:
  name: {{ include "verdandi.name" . }}
  labels:
    app.kubernetes.io/name: verdandi
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: verdandi
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "verdandi.name" . }}-hello
  labels:
    app.kubernetes.io/name: verdandi
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  internalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: verdandi
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
