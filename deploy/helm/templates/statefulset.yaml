apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "verdandi.name" . }}
  labels:
    app.kubernetes.io/name: verdandi
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ include "verdandi.name" . }}
  replicas: {{ .Values.replicas }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: verdandi
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: verdandi
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: {{ .Values.zoneSpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: verdandi
              app.kubernetes.io/instance: {{ .Release.Name }}
      containers:
        - name: verdandi
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: peer
              containerPort: 7946
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VERDANDI_CLUSTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "set clusterKey.secretName" .Values.clusterKey.secretName }}
                  key: {{ .Values.clusterKey.secretKey }}
            - name: VERDANDI_CLUSTER_URL
              value: http://{{ include "verdandi.name" . }}-hello.{{ .Release.Namespace }}.svc:8080
            {{- if .Values.backupUrl }}
            - name: VERDANDI_BACKUP_URL
              value: {{ .Values.backupUrl | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: data
              mountPath: /data
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
